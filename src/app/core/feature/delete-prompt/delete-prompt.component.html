
<div class="delete-prompt-overlay">

  <div class="confirmation-dialog">
    <div class="innerText">
      <app-head-line [variant]="'h1'" [text]="'Confirm Deletion'" [color]="'--base-black'"></app-head-line>
      <app-text
        [variant]="'body1'"
        [text]="'Are you sure you want to delete invoice #' + invoice()?.id + ' ? This action cannot be undone.'"
        [color]="'--grey-color-dark'"
      ></app-text>

      <div class="buttonLayout">
        <div class="button">
          <app-button [variant]="'delete'" (onClick)="onDelete()">Confirm</app-button>
          <app-button [variant]="'cancel'" (onClick)="onCancel()">Cancel</app-button>
        </div>
      </div>
    </div>
  </div>

</div>
