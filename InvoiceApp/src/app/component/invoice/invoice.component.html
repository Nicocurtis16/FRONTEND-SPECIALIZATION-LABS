<div class="invoicePanel">
  @for (card of invoice(); track card.id){
    <button class="invoiceCard">
      <div class="invoiceId">
        <app-head-line
          [variant]="'h3'"
          [text]="'#'"
          [color]="'--tertiary'"
        ></app-head-line>
        <app-head-line
          [variant]="'h3'"
          [text]="card.id"
          [color]="' --card-title-color'"
        ></app-head-line>
      </div>

      <div class="invoicePaymentDue">
        <app-text
          [variant]="'body1'"
          [text]="card.paymentDue"
          [color]="'--grey-color-dark'"
        ></app-text>
      </div>

      <div class="invoiceClientName">
        <app-text
          [variant]="'body1'"
          [text]="card.clientName"
          [color]="'--card-client-color'"
        ></app-text>
      </div>

      <div class="invoicePrice">
        <app-head-line
          [variant]="'h3'"
          [text]="''+ card.total"
          [color]="'--card-amount-color'"
        ></app-head-line>

      </div>




      <div class="invoiceStatus">
        <app-badge [status]="card.status"></app-badge>
        <div class="invoiceStatusIcon">
          <app-icon name="icon-arrow-right" alt="Arrow pointing right"></app-icon>
        </div>
      </div>
    </button>
  }

</div>
